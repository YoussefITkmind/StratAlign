name: spm-platform

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spm_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-spm_platform}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-spm} -d ${POSTGRES_DB:-spm_platform}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mock-oidc:
    image: ghcr.io/bluecatengineering/mock-oidc-provider:latest
    environment:
      PORT: 80
      TTL: 300
      USERS_FILE: /config/users.yml
    ports:
      - "${OIDC_PORT:-8092}:80"
    volumes:
      - ./infrastructure/oidc/users.yml:/config/users.yml:ro
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: