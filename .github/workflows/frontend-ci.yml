name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - "apps/frontend/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.json"
      - "eslint.config.js"
      - ".github/workflows/frontend-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "apps/frontend/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.json"
      - "eslint.config.js"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

jobs:
  frontend:
    name: Lint, test and build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_PUBLIC_TRPC_URL: http://localhost:4000/trpc
      AUTH_SECRET: ci-only-auth-secret-not-for-production-000000000000
      AUTH_TRUST_HOST: true
      AUTH_OIDC_ISSUER: https://oidc.ci.invalid/
      AUTH_OIDC_CLIENT_ID: ci-only-oidc-client
      AUTH_OIDC_CLIENT_SECRET: ci-only-oidc-client-secret-not-real
      AUTH_OIDC_JWKS_URI: https://oidc.ci.invalid/jwks
      AUTH_OIDC_SCOPES: openid profile email
      AUTH_OIDC_TOKEN_ENDPOINT_AUTH_METHOD: client_secret_post
      AUTH_OIDC_ALLOW_VERIFIED_EMAIL_LINKING: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build shared API
        run: pnpm --filter @spm/api... build

      - name: Lint frontend
        run: pnpm --filter @spm/frontend lint

      - name: Test frontend
        run: pnpm --filter @spm/frontend test

      - name: Build frontend
        run: pnpm --filter @spm/frontend build
