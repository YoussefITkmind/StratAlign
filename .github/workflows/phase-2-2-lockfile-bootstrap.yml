name: Phase 2.2 Lockfile Bootstrap

on:
  push:
    branches:
      - phase-2.2-strategy-traversal
    paths:
      - .github/workflows/phase-2-2-lockfile-bootstrap.yml

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase-2.2-strategy-traversal
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm add kysely@0.29.2 --filter @spm/backend
      - name: Commit dependency and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/backend/package.json pnpm-lock.yaml
          git commit -m "add Kysely for strategy traversal"
          git push origin HEAD:phase-2.2-strategy-traversal
